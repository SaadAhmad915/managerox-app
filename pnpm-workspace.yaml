allowBuilds:
  unrs-resolver: true

# Next 16.3.5 shipped 2026-09-11; pnpm blocks packages younger than the
# minimumReleaseAge window. These are first-party Vercel packages we chose
# deliberately, so they are excluded rather than switching the guard off.
minimumReleaseAgeExclude:
  - next
  - "@next/*"
  - eslint-config-next
